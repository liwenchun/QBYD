<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#12301f">
<meta name="robots" content="noindex,nofollow">
<title>登录 · 四川秦巴药都医药有限公司</title>
<style>
  :root{
    --green-900:#12301f;
    --green-800:#1a3d29;
    --green-700:#1f5236;
    --green-500:#2f7a4d;
    --green-100:#e8f0ea;
    --gold:#b8873b;
    --gold-light:#d9b273;
    --cream:#f7f5ef;
    --white:#ffffff;
    --ink:#1c2b23;
    --muted:#6b7a72;
    --line:#e2e6e2;
    --danger:#c0392b;
    --danger-bg:#fdf1ef;
    --warn:#8a6100;
    --warn-bg:#fdf6e3;
    --radius:16px;
    --shadow:0 18px 46px rgba(18,48,31,.14);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Source Han Sans SC",sans-serif;
    color:var(--ink);
    background:var(--cream);
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  button,input{font-family:inherit;}
  a{color:inherit;text-decoration:none;}

  /* ============ 布局 ============ */
  .page{
    display:grid;
    grid-template-columns:1.02fr .98fr;
    min-height:100vh;
    min-height:100svh;
  }

  /* ============ 左侧品牌区 ============ */
  .brand{
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:44px 52px;
    color:#fff;
    background:
      linear-gradient(160deg,rgba(9,26,17,.90) 0%,rgba(15,44,29,.78) 45%,rgba(9,26,17,.92) 100%),
      url("../images/生产加工图2.jpg") center/cover no-repeat,
      linear-gradient(145deg,var(--green-500),var(--green-900));
  }
  .brand::after{
    content:"";
    position:absolute;
    right:-120px;bottom:-140px;
    width:420px;height:420px;
    border-radius:50%;
    border:1px solid rgba(217,178,115,.22);
    box-shadow:0 0 0 60px rgba(217,178,115,.05),0 0 0 130px rgba(217,178,115,.03);
    pointer-events:none;
  }
  .brand-top{position:relative;z-index:2;display:flex;align-items:center;gap:12px;}
  .brand-mark{
    width:42px;height:42px;flex:none;border-radius:11px;
    display:grid;place-items:center;
    background:linear-gradient(145deg,var(--gold-light),var(--gold));
    color:#12301f;font-weight:800;font-size:19px;letter-spacing:0;
    box-shadow:0 6px 18px rgba(0,0,0,.22);
  }
  .brand-name{font-size:19px;font-weight:700;letter-spacing:2px;line-height:1.3;}
  .brand-name small{display:block;font-size:10px;font-weight:400;letter-spacing:3px;color:var(--gold-light);margin-top:2px;}

  .brand-body{position:relative;z-index:2;margin:auto 0;padding:34px 0;}
  .brand-title{
    font-family:"Songti SC","STSong","SimSun","Source Han Serif SC",serif;
    font-size:clamp(28px,3vw,44px);
    line-height:1.32;
    letter-spacing:1px;
    font-weight:700;
  }
  .brand-title em{font-style:normal;color:var(--gold-light);}
  .brand-line{width:52px;height:3px;background:var(--gold);margin:22px 0 20px;border-radius:2px;}
  .brand-desc{max-width:420px;font-size:14px;line-height:2;color:rgba(255,255,255,.76);}
  .brand-tags{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px;}
  .brand-tags span{
    font-size:12px;padding:6px 14px;border-radius:999px;
    border:1px solid rgba(217,178,115,.38);color:var(--gold-light);
    background:rgba(255,255,255,.05);
  }

  .brand-foot{position:relative;z-index:2;font-size:12px;color:rgba(255,255,255,.55);letter-spacing:.4px;}
  .brand-foot b{color:rgba(255,255,255,.82);font-weight:500;}

  /* ============ 右侧表单区 ============ */
  .panel{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:48px 40px;
    background:
      radial-gradient(1200px 600px at 100% 0%,#ffffff 0%,var(--cream) 62%);
  }
  .card{
    width:100%;
    max-width:408px;
    background:var(--white);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:38px 36px 30px;
  }
  .card-head{margin-bottom:26px;}
  .card-head .eyebrow{
    font-size:11px;letter-spacing:3px;color:var(--gold);font-weight:600;
    text-transform:uppercase;margin-bottom:8px;
  }
  .card-head h1{
    font-family:"Songti SC","STSong","SimSun",serif;
    font-size:26px;font-weight:700;letter-spacing:.5px;color:var(--green-900);
  }
  .card-head p{font-size:13px;color:var(--muted);margin-top:7px;}

  /* ---- 字段 ---- */
  .field{margin-bottom:17px;}
  .field > label{
    display:block;font-size:13px;font-weight:600;color:#33473c;margin-bottom:7px;
  }
  .control{position:relative;display:flex;align-items:center;}
  .control .icon{
    position:absolute;left:13px;width:17px;height:17px;
    color:#9aa8a0;pointer-events:none;transition:color .2s;
  }
  .control input{
    width:100%;height:46px;
    padding:0 14px 0 40px;
    font-size:15px;
    color:var(--ink);
    background:#fbfcfb;
    border:1px solid #dde3de;
    border-radius:10px;
    outline:none;
    transition:border-color .18s,box-shadow .18s,background .18s;
  }
  .control input::placeholder{color:#b3bdb7;}
  .control input:hover{border-color:#c8d2cb;}
  .control input:focus{
    background:#fff;
    border-color:var(--green-500);
    box-shadow:0 0 0 3px rgba(47,122,77,.13);
  }
  .control input:focus ~ .icon,
  .control:focus-within .icon{color:var(--green-500);}

  /* 密码显隐 */
  .control.has-toggle input{padding-right:46px;}
  .toggle-pwd{
    position:absolute;right:6px;width:34px;height:34px;
    display:grid;place-items:center;
    border:0;background:transparent;border-radius:8px;
    color:#9aa8a0;cursor:pointer;transition:color .18s,background .18s;
  }
  .toggle-pwd:hover{color:var(--green-700);background:var(--green-100);}
  .toggle-pwd svg{width:18px;height:18px;}

  /* 验证码行 */
  .captcha-row{display:flex;gap:10px;align-items:stretch;}
  .captcha-row .control{flex:1 1 auto;min-width:0;}
  .captcha-box{
    flex:0 0 auto;
    width:118px;height:46px;
    padding:0;border:1px solid #dde3de;border-radius:10px;
    background:#fff;overflow:hidden;cursor:pointer;
    display:grid;place-items:center;
    transition:border-color .18s,box-shadow .18s;
  }
  .captcha-box:hover{border-color:var(--green-500);box-shadow:0 0 0 3px rgba(47,122,77,.10);}
  .captcha-box:active{transform:scale(.985);}
  .captcha-box canvas{display:block;width:116px;height:44px;}

  /* 错误提示 */
  .err{
    display:none;
    font-size:12.5px;line-height:1.5;color:var(--danger);
    margin-top:6px;padding-left:2px;
  }
  .err::before{
    content:"";
    display:inline-block;width:5px;height:5px;border-radius:50%;
    background:var(--danger);margin-right:6px;vertical-align:2px;
  }
  .field.is-error .err{display:block;}
  .field.is-error .control input,
  .field.is-error .captcha-box{
    border-color:#e0a49c;
    background:var(--danger-bg);
    box-shadow:none;
  }
  .field.is-error .control input:focus{box-shadow:0 0 0 3px rgba(192,57,43,.10);}

  /* 登录按钮 */
  .submit{
    width:100%;height:48px;margin-top:6px;
    border:0;border-radius:10px;cursor:pointer;
    font-size:15.5px;font-weight:600;letter-spacing:4px;
    color:#fff;
    background:linear-gradient(135deg,var(--green-700),var(--green-900));
    box-shadow:0 8px 20px rgba(18,48,31,.22);
    transition:transform .16s,box-shadow .16s,opacity .16s;
  }
  .submit:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 12px 26px rgba(18,48,31,.28);}
  .submit:active:not(:disabled){transform:translateY(0);}
  .submit:disabled{opacity:.62;cursor:not-allowed;box-shadow:none;letter-spacing:1px;}
  .submit .spin{
    display:inline-block;width:14px;height:14px;margin-right:8px;
    border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;
    vertical-align:-2px;animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* 提示条 */
  .notice{
    display:none;
    margin-top:16px;padding:11px 13px;
    font-size:12.5px;line-height:1.65;
    border-radius:9px;
    background:var(--warn-bg);
    border:1px solid #f0e0b8;
    color:var(--warn);
    word-break:break-all;
  }
  .notice.show{display:block;}
  .notice.info{background:var(--green-100);border-color:#cfe2d5;color:var(--green-700);}
  .notice.actions{display:none;}
  .notice.actions.show{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .mini-btn{
    border:1px solid rgba(0,0,0,.12);background:#fff;
    padding:5px 12px;border-radius:7px;font-size:12px;cursor:pointer;
    color:#3c4a42;transition:.16s;
  }
  .mini-btn:hover{border-color:var(--green-500);color:var(--green-700);background:#f6faf7;}

  /* 页脚 */
  .card-foot{
    display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;
    margin-top:22px;padding-top:18px;
    border-top:1px solid #eef1ee;
    font-size:12.5px;color:var(--muted);
  }
  .card-foot a:hover{color:var(--green-700);}
  .card-foot .dot{color:#c9d2cb;}
  .copyright{
    margin-top:22px;font-size:11.5px;color:#a3aea7;text-align:center;letter-spacing:.3px;
  }

  /* toast */
  .toast-layer{position:fixed;left:50%;bottom:38px;transform:translateX(-50%);z-index:99;pointer-events:none;}
  .toast{
    padding:11px 20px;border-radius:999px;
    background:rgba(18,48,31,.94);color:#fff;
    font-size:13px;letter-spacing:.3px;
    box-shadow:0 10px 28px rgba(0,0,0,.22);
    opacity:0;transform:translateY(10px);
    transition:opacity .22s,transform .22s;
  }
  .toast.show{opacity:1;transform:translateY(0);}
  .toast.ok{background:linear-gradient(135deg,var(--green-700),var(--green-900));}
  .toast.bad{background:linear-gradient(135deg,#a8352a,#7d241c);}

  /* 成功遮罩 */
  .mask{
    position:fixed;inset:0;z-index:120;
    display:none;place-items:center;
    background:rgba(10,26,17,.72);
    backdrop-filter:blur(3px);
  }
  .mask.show{display:grid;}
  .mask-inner{text-align:center;color:#fff;}
  .mask-inner .spin2{
    width:38px;height:38px;margin:0 auto 16px;
    border:3px solid rgba(255,255,255,.28);border-top-color:var(--gold-light);border-radius:50%;
    animation:spin .8s linear infinite;
  }
  .mask-inner p{font-size:14px;letter-spacing:1.5px;}
  .mask-inner span{display:block;font-size:12px;color:rgba(255,255,255,.6);margin-top:6px;letter-spacing:.5px;}

  /* ============ 平板 ============ */
  @media (max-width:1080px){
    .brand{padding:34px 34px;}
    .panel{padding:36px 26px;}
    .card{padding:32px 26px 26px;}
    .brand-desc{font-size:13px;}
  }

  /* ============ 手机 ============ */
  @media (max-width:900px){
    .page{grid-template-columns:1fr;min-height:100svh;}
    .brand{
      min-height:auto;
      padding:22px 20px 30px;
      border-radius:0 0 22px 22px;
      justify-content:flex-start;
      background:
        linear-gradient(160deg,rgba(9,26,17,.94) 0%,rgba(15,44,29,.90) 55%,rgba(9,26,17,.96) 100%),
        url("../images/生产加工图2.jpg") center 38%/cover no-repeat,
        linear-gradient(145deg,var(--green-500),var(--green-900));
    }
    .brand::after{width:260px;height:260px;right:-110px;bottom:-120px;box-shadow:0 0 0 34px rgba(217,178,115,.05);}
    .brand-body{padding:16px 0 0;margin:0;}
    .brand-title{font-size:23px;letter-spacing:.5px;}
    .brand-line{width:38px;height:2px;margin:14px 0 12px;}
    .brand-desc{display:none;}
    .brand-tags{margin-top:14px;gap:7px;}
    .brand-tags span{font-size:11px;padding:4px 10px;}
    .brand-foot{display:none;}
    .brand-mark{width:36px;height:36px;border-radius:9px;font-size:16px;}
    .brand-name{font-size:16px;letter-spacing:1.2px;}
    .brand-name small{font-size:9px;letter-spacing:2px;}

    .panel{
      padding:20px 14px calc(26px + env(safe-area-inset-bottom));
      justify-content:flex-start;
      background:var(--cream);
    }
    .card{
      max-width:none;
      margin-top:-12px;
      padding:26px 18px 22px;
      border-radius:18px;
      box-shadow:0 12px 30px rgba(18,48,31,.10);
    }
    .card-head{margin-bottom:20px;}
    .card-head h1{font-size:22px;}
    .card-head p{font-size:12.5px;}

    /* 手机端输入字号 16px，避免 iOS 聚焦自动放大 */
    .control input{font-size:16px;height:48px;}
    .control input::placeholder{font-size:14px;}
    .captcha-box{width:106px;height:48px;}
    .captcha-box canvas{width:104px;height:46px;}
    .submit{height:50px;font-size:16px;}
    .card-foot{font-size:12px;gap:6px;}
    .copyright{margin-top:16px;font-size:11px;}
    .toast-layer{bottom:calc(24px + env(safe-area-inset-bottom));width:calc(100% - 32px);text-align:center;}
    .toast{display:inline-block;}
  }

  @media (max-width:380px){
    .brand-title{font-size:20px;}
    .brand-tags span:nth-child(3){display:none;}
    .captcha-box{width:94px;}
    .captcha-box canvas{width:92px;height:44px;}
  }

  /* 横屏矮屏 */
  @media (max-height:560px) and (min-width:901px){
    .brand-body{padding:10px 0;}
    .brand-title{font-size:28px;}
    .brand-desc,.brand-tags{display:none;}
    .card{padding:24px 26px 20px;}
    .panel{padding:24px 30px;}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms!important;transition-duration:.001ms!important;}
  }
</style>
</head>
<body>
<div class="page">

  <!-- ================= 左：品牌区 ================= -->
  <section class="brand" aria-hidden="true">
    <div class="brand-top">
      <div class="brand-mark">秦</div>
      <div class="brand-name">秦巴药都<small>QINBA HERBS</small></div>
    </div>

    <div class="brand-body">
      <h2 class="brand-title">秦巴道地中药材<br><em>全产业链</em>服务平台</h2>
      <div class="brand-line"></div>
      <p class="brand-desc">依托秦巴山区道地药材资源，专注中药材种植、产地加工、仓储物流与产销对接，构建覆盖全链条的数据化服务体系。</p>
      <div class="brand-tags">
        <span>种植基地</span>
        <span>产地加工</span>
        <span>仓储物流</span>
        <span>产销对接</span>
      </div>
    </div>

    <div class="brand-foot">
      四川秦巴药都医药有限公司 &nbsp;·&nbsp; <b>0839-5217284</b> &nbsp;·&nbsp; 苍溪县紫云工业园区
    </div>
  </section>

  <!-- ================= 右：登录表单 ================= -->
  <main class="panel">
    <div class="card">
      <header class="card-head">
        <div class="eyebrow">Member Access</div>
        <h1>账号登录</h1>
        <p>请使用公司分配的账号登录系统</p>
      </header>

      <form id="loginForm" novalidate autocomplete="off">
        <!-- 用户名 -->
        <div class="field" id="f-user">
          <label for="username">用户名</label>
          <div class="control">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input id="username" name="username" type="text" placeholder="请输入用户名" autocomplete="username" autocapitalize="off" spellcheck="false" maxlength="32">
          </div>
          <p class="err" id="err-user" role="alert"></p>
        </div>

        <!-- 密码 -->
        <div class="field" id="f-pwd">
          <label for="password">用户密码</label>
          <div class="control has-toggle">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input id="password" name="password" type="password" placeholder="请输入密码" autocomplete="current-password" maxlength="64">
            <button type="button" class="toggle-pwd" id="togglePwd" title="显示 / 隐藏密码" aria-label="显示密码">
              <svg id="eyeOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12S5 5.5 12 5.5 22.5 12 22.5 12 19 18.5 12 18.5 1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <p class="err" id="err-pwd" role="alert"></p>
        </div>

        <!-- 验证码 -->
        <div class="field" id="f-cap">
          <label for="captcha">图片验证码</label>
          <div class="captcha-row">
            <div class="control">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/><path d="M9 12l2 2 4-4"/></svg>
              <input id="captcha" name="captcha" type="text" placeholder="输入右侧 4 位验证码" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="4" inputmode="text">
            </div>
            <button type="button" class="captcha-box" id="captchaRefresh" title="看不清？点击换一张" aria-label="点击刷新验证码">
              <canvas id="captchaCanvas" width="116" height="44"></canvas>
            </button>
          </div>
          <p class="err" id="err-cap" role="alert"></p>
        </div>

        <button type="submit" class="submit" id="submitBtn"><span id="btnText">登 录</span></button>

        <div class="notice" id="notice"></div>
        <div class="notice actions" id="noticeActions"></div>
      </form>

      <footer class="card-foot">
        <a href="../index.html">← 返回官网首页</a>
      </footer>
    </div>

    <p class="copyright">© 2026 四川秦巴药都医药有限公司 · 内部系统</p>
  </main>
</div>

<div class="toast-layer"><div class="toast" id="toast"></div></div>

<div class="mask" id="mask">
  <div class="mask-inner">
    <div class="spin2"></div>
    <p id="maskText">正在登录…</p>
    <span id="maskSub">正在校验账号权限</span>
  </div>
</div>

<!-- 本地 Excel 解析库（已下载到本地，离线可用） -->
<script src="./js/xlsx.full.min.js"></script>
<!-- 可选：双击(file://)模式下的内置数据快照，不存在时不影响 -->
<script src="../data/usersData.js" onerror="void 0"></script>

<script>
(function () {
  'use strict';

  /* ==================== 配置 ==================== */
  var CONFIG = {
    usersFile: '../data/usersData.xlsx',
    usersSheet: ['用户', '用户表', '用户信息', 'users', 'Users'],
    permSheet: ['用户权限', '权限', '权限表', 'permissions', 'Permissions'],
    home: './home.html',
    storageKey: 'qbd.auth'
  };

  var ROLE_GENERAL = '一般用户';
  var ROLE_MANAGER = '管理用户';
  var ROLE_SUPER   = '超级管理用户';

  /* ==================== 状态 ==================== */
  var state = {
    users: null,          // [{username, password, role, name}]
    perm: null,           // {tables:[{name, cols:{角色:0|1}}]}
    source: '',           // 数据来源描述
    loading: false,
    submitting: false,
    captcha: ''
  };

  /* ==================== 元素 ==================== */
  var $ = function (id) { return document.getElementById(id); };
  var form = $('loginForm');
  var elUser = $('username');
  var elPwd = $('password');
  var elCap = $('captcha');
  var btn = $('submitBtn');
  var btnText = $('btnText');
  var notice = $('notice');
  var noticeActions = $('noticeActions');
  var canvas = $('captchaCanvas');
  var ctx = canvas.getContext('2d');
  var toastEl = $('toast');
  var mask = $('mask');

  /* ==================== 设备识别 ==================== */
  function detectDevice() {
    var w = window.innerWidth;
    var mobileUA = /Android|iPhone|iPad|iPod|Windows Phone|HarmonyOS|Mobile/i.test(navigator.userAgent);
    var touch = ('ontouchstart' in window) && navigator.maxTouchPoints > 0;
    var device = w <= 900 ? 'mobile' : (w <= 1200 ? 'tablet' : 'desktop');
    document.documentElement.setAttribute('data-device', device);
    document.documentElement.setAttribute('data-touch', touch || mobileUA ? '1' : '0');
  }
  detectDevice();

  var resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      detectDevice();
      drawCaptcha(state.captcha);
    }, 160);
  });
  window.addEventListener('orientationchange', function () {
    setTimeout(function () { detectDevice(); drawCaptcha(state.captcha); }, 220);
  });

  /* ==================== 验证码 ==================== */
  var CHAR_POOL = 'ACDEFGHJKLMNPQRTUVWXY34679'; // 去除易混字符 0O 1lI 2Z 5S 8B

  function randomCode(len) {
    var s = '';
    for (var i = 0; i < len; i++) {
      s += CHAR_POOL.charAt(Math.floor(Math.random() * CHAR_POOL.length));
    }
    return s;
  }

  function drawCaptcha(code) {
    if (!code) code = randomCode(4);
    state.captcha = code;

    var cssW = canvas.clientWidth || 116;
    var cssH = canvas.clientHeight || 44;
    var dpr = Math.min(window.devicePixelRatio || 1, 3);

    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cssW, cssH);

    // 背景
    var g = ctx.createLinearGradient(0, 0, cssW, cssH);
    g.addColorStop(0, '#f4f8f4');
    g.addColorStop(0.5, '#eaf2ec');
    g.addColorStop(1, '#f7f3e9');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, cssW, cssH);

    // 噪点
    for (var i = 0; i < 46; i++) {
      ctx.beginPath();
      ctx.fillStyle = 'rgba(' + rnd(90, 160) + ',' + rnd(110, 165) + ',' + rnd(95, 150) + ',' + (0.12 + Math.random() * 0.3) + ')';
      ctx.arc(Math.random() * cssW, Math.random() * cssH, Math.random() * 1.5 + 0.4, 0, Math.PI * 2);
      ctx.fill();
    }

    // 干扰线
    for (var j = 0; j < 3; j++) {
      ctx.beginPath();
      ctx.strokeStyle = 'rgba(' + rnd(60, 130) + ',' + rnd(100, 150) + ',' + rnd(80, 130) + ',' + (0.25 + Math.random() * 0.25) + ')';
      ctx.lineWidth = 0.9 + Math.random() * 0.9;
      ctx.moveTo(Math.random() * cssW * 0.3, Math.random() * cssH);
      ctx.bezierCurveTo(
        cssW * 0.35, Math.random() * cssH,
        cssW * 0.65, Math.random() * cssH,
        cssW * (0.7 + Math.random() * 0.3), Math.random() * cssH
      );
      ctx.stroke();
    }

    // 字符
    var colors = ['#1f5236', '#2f7a4d', '#8a6a2a', '#12301f'];
    var step = cssW / (code.length + 0.4);
    for (var k = 0; k < code.length; k++) {
      ctx.save();
      var x = step * (k + 0.72);
      var y = cssH * 0.66 + (Math.random() - 0.5) * 3;
      ctx.translate(x, y);
      ctx.rotate((Math.random() - 0.5) * 0.46);
      ctx.font = 'bold ' + Math.round(cssH * 0.62 + Math.random() * 3) + 'px "Georgia","Times New Roman",serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
      ctx.fillText(code.charAt(k), 0, 0);
      ctx.restore();
    }

    // 上下边框线
    ctx.strokeStyle = 'rgba(31,82,54,.12)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, 0.5); ctx.lineTo(cssW, 0.5);
    ctx.moveTo(0, cssH - 0.5); ctx.lineTo(cssW, cssH - 0.5);
    ctx.stroke();
  }

  function rnd(a, b) { return Math.floor(a + Math.random() * (b - a)); }

  $('captchaRefresh').addEventListener('click', function () {
    drawCaptcha(randomCode(4));
    clearErr('f-cap');
  });

  /* ==================== 提示工具 ==================== */
  var toastTimer = null;
  function toast(msg, type) {
    toastEl.textContent = msg;
    toastEl.className = 'toast show' + (type ? ' ' + type : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.className = 'toast'; }, 2600);
  }

  function showNotice(html, type) {
    notice.className = 'notice show' + (type === 'info' ? ' info' : '');
    notice.innerHTML = html;
  }
  function hideNotice() { notice.className = 'notice'; }

  function showActions(html) {
    noticeActions.className = 'notice actions show';
    noticeActions.innerHTML = html;
  }
  function hideActions() { noticeActions.className = 'notice actions'; }

  function showErr(fieldId, errId, msg) {
    var f = $(fieldId);
    f.classList.add('is-error');
    $(errId).textContent = msg;
  }
  function clearErr(fieldId) {
    var f = $(fieldId);
    if (!f) return;
    f.classList.remove('is-error');
    var e = f.querySelector('.err');
    if (e) e.textContent = '';
  }
  function clearAllErr() {
    clearErr('f-user'); clearErr('f-pwd'); clearErr('f-cap');
  }

  function setLoading(on, text) {
    state.submitting = on;
    btn.disabled = on;
    btnText.innerHTML = on ? '<span class="spin"></span>' + (text || '验证中…') : '登 录';
  }

  function showMask(text, sub) {
    $('maskText').textContent = text || '正在登录…';
    $('maskSub').textContent = sub || '';
    mask.classList.add('show');
  }
  function hideMask() { mask.classList.remove('show'); }

  /* ==================== 数据读取 ==================== */
  function pickSheetName(wb, candidates) {
    var names = wb.SheetNames || [];
    for (var i = 0; i < candidates.length; i++) {
      for (var j = 0; j < names.length; j++) {
        if (names[j].trim() === candidates[i]) return names[j];
      }
    }
    for (var m = 0; m < candidates.length; m++) {
      for (var n = 0; n < names.length; n++) {
        if (names[n].indexOf(candidates[m]) !== -1) return names[n];
      }
    }
    return null;
  }

  function normRow(row) {
    var o = {};
    for (var k in row) {
      if (!Object.prototype.hasOwnProperty.call(row, k)) continue;
      o[String(k).replace(/\s/g, '').replace(/[:：*]/g, '')] = row[k];
    }
    return o;
  }

  function cell(row, keys) {
    for (var i = 0; i < keys.length; i++) {
      if (row[keys[i]] !== undefined && row[keys[i]] !== null && String(row[keys[i]]).trim() !== '') {
        return row[keys[i]];
      }
    }
    return '';
  }

  function parseWorkbook(buf) {
    if (typeof XLSX === 'undefined') throw new Error('NO_XLSX_LIB');
    var wb = XLSX.read(new Uint8Array(buf), { type: 'array' });
    var usersName = pickSheetName(wb, CONFIG.usersSheet);
    if (!usersName) throw new Error('NO_USERS_SHEET');

    var usersRaw = XLSX.utils.sheet_to_json(wb.Sheets[usersName], { defval: '', raw: false });
    var users = [];
    for (var i = 0; i < usersRaw.length; i++) {
      var r = normRow(usersRaw[i]);
      var name = String(cell(r, ['用户名', '账号', '用户帐号', '用户', '账号名', 'username'])).trim();
      if (!name) continue;
      var pwd = String(cell(r, ['用户密码', '密码', '登录密码', 'password']));
      var role = String(cell(r, ['权限', '角色', '用户权限', '权限类型', 'role'])).trim() || ROLE_GENERAL;
      users.push({
        username: name,
        password: pwd,
        role: role,
        realName: String(cell(r, ['姓名', '用户姓名', '真实姓名', 'name'])).trim(),
        remark: String(cell(r, ['备注', '说明', 'remark'])).trim()
      });
    }
    if (!users.length) throw new Error('EMPTY_USERS_SHEET');

    // 权限表
    var permName = pickSheetName(wb, CONFIG.permSheet);
    var perm = null;
    if (permName) {
      var pRaw = XLSX.utils.sheet_to_json(wb.Sheets[permName], { defval: '', raw: false });
      var tables = [];
      for (var j = 0; j < pRaw.length; j++) {
        var pr = normRow(pRaw[j]);
        var tname = String(cell(pr, ['表名', '表名称', '数据表', '页面', '模块', 'sheet'])).trim();
        if (!tname) continue;
        var cols = {};
        var deletable = 1;
        for (var key in pr) {
          if (!Object.prototype.hasOwnProperty.call(pr, key)) continue;
          if (key === '表名' || key === '表名称' || key === '数据表' || key === '页面' || key === '模块' || key === 'sheet') continue;
          // 可选的「可删除」列：表级控制该表是否允许管理用户删除（超级管理用户不受限）
          if (key === '可删除' || key === '允许删除' || key === '删除') { deletable = toFlag(pr[key]); continue; }
          cols[key] = toFlag(pr[key]);
        }
        tables.push({ name: tname, cols: cols, deletable: deletable });
      }
      perm = { sheetName: permName, tables: tables };
    }

    state.users = users;
    state.perm = perm;
  }

  function toFlag(v) {
    var s = String(v == null ? '' : v).trim().toLowerCase();
    if (['1', '1.0', 'y', 'yes', 'true', '是', '允许', '可', '√', '有'].indexOf(s) !== -1) return 1;
    return 0;
  }

  function fetchFromServer() {
    var url = new URL(CONFIG.usersFile, document.baseURI).href;
    return fetch(url, { cache: 'no-store' }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.arrayBuffer();
    });
  }

  function loadSnapshot() {
    var snap = window.__USERS_DATA__;
    if (!snap || !snap.users || !snap.users.length) throw new Error('NO_SNAPSHOT');
    var users = [];
    for (var i = 0; i < snap.users.length; i++) {
      var u = snap.users[i];
      var name = String(cell(normRow(u), ['用户名', '账号', '用户', 'username'])).trim();
      if (!name) continue;
      users.push({
        username: name,
        password: String(cell(normRow(u), ['用户密码', '密码', 'password'])),
        role: String(cell(normRow(u), ['权限', '角色', 'role'])).trim() || ROLE_GENERAL,
        realName: String(cell(normRow(u), ['姓名', 'name'])).trim(),
        remark: ''
      });
    }
    if (!users.length) throw new Error('NO_SNAPSHOT');
    state.users = users;
    state.perm = snap.perm && snap.perm.tables ? snap.perm : null;
    return snap.generatedAt || '';
  }

  function ensureData() {
    if (state.users) return Promise.resolve();
    if (state.loading) {
      return new Promise(function (resolve, reject) {
        var t = setInterval(function () {
          if (state.users) { clearInterval(t); resolve(); }
          else if (!state.loading) { clearInterval(t); reject(new Error('LOAD_FAILED')); }
        }, 60);
      });
    }
    state.loading = true;
    hideNotice(); hideActions();

    var isFile = location.protocol === 'file:';

    var chain = isFile
      ? Promise.reject(new Error('FILE_PROTOCOL'))
      : fetchFromServer().then(function (buf) {
          parseWorkbook(buf);
          state.source = 'excel';
          state.loading = false;
        });

    return chain.catch(function (err) {
      // 降级 1：内置快照（静默载入，不提示）
      try {
        loadSnapshot();
        state.source = 'snapshot';
        state.loading = false;
        return;
      } catch (e2) { /* 继续降级 */ }

      state.loading = false;
      state.source = 'none';
      if (err && err.message === 'NO_USERS_SHEET') {
        showNotice('usersData.xlsx 中未找到「用户」工作表，请检查表名是否为「用户」。');
      } else if (err && err.message === 'EMPTY_USERS_SHEET') {
        showNotice('「用户」工作表中没有有效的用户记录，请至少录入一行用户名与密码。');
      } else if (isFile) {
        showNotice('未读取到用户数据，请在下方手动选择 usersData.xlsx，或运行 start-login.bat 后访问登录页。');
      } else {
        showNotice('读取 data/usersData.xlsx 失败：' + (err && err.message ? err.message : '未知错误') +
          '，请确认文件位于 data 目录，或运行 start-login.bat 后重试。');
      }
      showFilePicker();
      throw new Error('DATA_UNAVAILABLE');
    });
  }

  function showFilePicker() {
    showActions('<span style="margin-right:2px">手动载入：</span>' +
      '<button type="button" class="mini-btn" id="pickFileBtn">选择 usersData.xlsx</button>' +
      '<input type="file" id="pickFileInput" accept=".xlsx,.xls" hidden>');
    var b = $('pickFileBtn');
    var f = $('pickFileInput');
    if (!b || !f) return;
    b.addEventListener('click', function () { f.click(); });
    f.addEventListener('change', function () {
      var file = f.files && f.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function (ev) {
        try {
          parseWorkbook(ev.target.result);
          state.source = 'manual';
          hideNotice(); hideActions();
          showNotice('已载入本地文件「' + file.name + '」，可以继续登录。', 'info');
        } catch (ex) {
          showNotice('文件解析失败：' + (ex && ex.message ? ex.message : '格式不支持') + '，请确认是本系统的 usersData.xlsx。');
        }
      };
      reader.onerror = function () { showNotice('文件读取失败，请重试。'); };
      reader.readAsArrayBuffer(file);
    });
  }

  /* ==================== 权限计算 ==================== */
  // 操作级别：r=只读  rw=读写  rwd=读写+删除
  function modeFor(role, table) {
    if (role === ROLE_SUPER) return 'rwd';                    // 超级管理用户：全部页面读写+删除
    if (role === ROLE_MANAGER) {                              // 管理用户：可见页面读写+删除
      if (table && table.deletable === 0) return 'rw';        // 权限表标注不可删除时降级为读写
      return 'rwd';
    }
    return 'r';                                               // 一般用户：可见页面只读
  }

  function tablesForRole(role) {
    var out = [];
    if (role === ROLE_SUPER) {
      // 超级管理员：全部表
      if (state.perm && state.perm.tables) {
        for (var i = 0; i < state.perm.tables.length; i++) {
          out.push({ name: state.perm.tables[i].name, mode: 'rwd' });
        }
      }
      return { list: out, all: true };
    }
    if (state.perm && state.perm.tables) {
      for (var j = 0; j < state.perm.tables.length; j++) {
        var t = state.perm.tables[j];
        var allow = 0;
        for (var key in t.cols) {
          if (!Object.prototype.hasOwnProperty.call(t.cols, key)) continue;
          if (key.replace(/\s/g, '') === role.replace(/\s/g, '')) { allow = t.cols[key]; break; }
        }
        if (allow === 1) {
          out.push({ name: t.name, mode: modeFor(role, t) });
        }
      }
    }
    return { list: out, all: false };
  }

  /* ==================== 登录主流程 ==================== */
  function validateBasic(u, p, c) {
    var ok = true;
    clearAllErr();

    if (!u) { showErr('f-user', 'err-user', '请输入用户名'); ok = false; }
    if (!p) { showErr('f-pwd', 'err-pwd', '请输入用户密码'); ok = false; }

    if (!c) {
      showErr('f-cap', 'err-cap', '请输入图片验证码');
      ok = false;
    } else if (c.toUpperCase() !== state.captcha.toUpperCase()) {
      showErr('f-cap', 'err-cap', '验证码错误，请重新输入');
      drawCaptcha(randomCode(4));
      elCap.value = '';
      ok = false;
    }
    return ok;
  }

  function matchUser(u, p) {
    var list = state.users || [];
    var target = null;
    for (var i = 0; i < list.length; i++) {
      if (list[i].username.toLowerCase() === u.toLowerCase()) { target = list[i]; break; }
    }
    if (!target) return { ok: false, field: 'f-user', msg: '用户名不存在' };

    if (target.password === p) return { ok: true, user: target };
    // 容错：用户输入首尾误带空格
    if (target.password === p.trim()) return { ok: true, user: target };
    return { ok: false, field: 'f-pwd', msg: '密码错误' };
  }

  function onLoginSuccess(user) {
    var ts = Date.now();
    var d = new Date(ts);
    var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
    var tsText = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' +
                 pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());

    var permInfo = tablesForRole(user.role);

    var auth = {
      username: user.username,
      role: user.role,
      realName: user.realName,
      loginAt: ts,
      loginAtText: tsText,
      tables: permInfo.list,
      allTables: permInfo.all,
      // 供 home.html 直接使用的权限汇总
      permissions: {
        canRead: true,
        canWrite: user.role === ROLE_MANAGER || user.role === ROLE_SUPER,
        canDelete: user.role === ROLE_MANAGER || user.role === ROLE_SUPER
      },
      dataSource: state.source
    };

    try {
      sessionStorage.setItem(CONFIG.storageKey, JSON.stringify(auth));
      sessionStorage.setItem('qbd.username', user.username);
      sessionStorage.setItem('qbd.loginAt', String(ts));
    } catch (e) { /* 隐私模式下忽略 */ }
    try {
      localStorage.setItem('qbd.lastUser', user.username);
    } catch (e2) { /* 忽略 */ }

    // 只传递「用户名 + 登录成功时间戳」，密码与权限明细不再出现在地址栏
    var url = CONFIG.home + '?' + new URLSearchParams({
      user: user.username,
      ts: String(ts)
    }).toString();

    // 校验全部通过：立即跳转 home.html，不做等待与额外探测
    window.location.href = url;
  }

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (state.submitting) return;

    var u = elUser.value.trim();
    var p = elPwd.value;
    var c = elCap.value.trim();

    if (!validateBasic(u, p, c)) return;

    setLoading(true, '验证中…');
    hideActions();

    ensureData().then(function () {
      var r = matchUser(u, p);
      if (!r.ok) {
        setLoading(false);
        showErr(r.field, r.field === 'f-user' ? 'err-user' : 'err-pwd', r.msg);
        if (r.field === 'f-user') { elUser.focus(); } else { elPwd.focus(); }
        return;
      }
      onLoginSuccess(r.user);
    }).catch(function (err) {
      setLoading(false);
      if (err && err.message !== 'DATA_UNAVAILABLE') {
        toast('登录失败，请稍后重试', 'bad');
      } else {
        toast('用户数据未就绪，请先按提示载入数据', 'bad');
      }
    });
  });

  /* ==================== 输入联动 ==================== */
  elUser.addEventListener('input', function () { clearErr('f-user'); });
  elPwd.addEventListener('input', function () { clearErr('f-pwd'); });
  elCap.addEventListener('input', function () {
    clearErr('f-cap');
    if (elCap.value.length >= 4) {
      // 自动大写提示无意义，仅保持原样
    }
  });

  elCap.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); form.requestSubmit ? form.requestSubmit() : form.dispatchEvent(new Event('submit', { cancelable: true })); }
  });

  var pwdVisible = false;
  $('togglePwd').addEventListener('click', function () {
    pwdVisible = !pwdVisible;
    elPwd.type = pwdVisible ? 'text' : 'password';
    this.setAttribute('aria-label', pwdVisible ? '隐藏密码' : '显示密码');
    this.innerHTML = pwdVisible
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12S5 5.5 12 5.5 22.5 12 22.5 12 19 18.5 12 18.5 1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12S5 5.5 12 5.5 22.5 12 22.5 12 19 18.5 12 18.5 1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/></svg>';
    elPwd.focus();
  });

  /* ==================== 初始化 ==================== */
  function init() {
    drawCaptcha(randomCode(4));

    // 记住上次登录用户名
    try {
      var last = localStorage.getItem('qbd.lastUser');
      if (last) elUser.value = last;
    } catch (e) { /* 忽略 */ }

    // 预热：提前加载用户表，缩短首次点击等待（失败提示由 ensureData 统一给出）
    ensureData().catch(function () { /* 已提示 */ });

    // home.html 会话超时 / 状态失效回跳时的提示（等用户数据就绪后再显示，避免被覆盖）
    var q = new URLSearchParams(location.search);
    var backReason = q.get('reason') || (q.get('expired') === '1' ? 'expired' : '');
    if (backReason) {
      var tipTimer = setInterval(function () {
        if (state.users) {
          clearInterval(tipTimer);
          showNotice(backReason === 'expired'
            ? '登录已超时（连续 5 分钟无鼠标/键盘操作），请重新登录。'
            : '登录状态已失效，请重新登录。', 'info');
        }
      }, 120);
      setTimeout(function () { clearInterval(tipTimer); }, 8000);
    }

    // 测试与调试钩子（纯前端演示用）
    window.__QBD_LOGIN__ = {
      getCaptcha: function () { return state.captcha; },
      refresh: function () { drawCaptcha(randomCode(4)); return state.captcha; },
      getUsers: function () { return state.users; },
      getSource: function () { return state.source; }
    };
  }

  init();
})();
</script>
</body>
